<!DOCTYPE html>
<html lang="en"> <!--Husk at ændre lang til da hvis programmet er dansk?-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storcenter Nord Akvarie</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <section id="scene" class="scene">
            <div id="sun" class="sun"></div>
            <div class="bg">
                <img src="img/red-car.png" id="redCar" class="car1">
                <img src="img/car.gif" id="policeCar" class="car2">
                <img src="img/light-blue-car.png" id="blueCar" class="car3">
                <img src="img/bus.webp" id="bus" class="car4" alt="Yellow bus driving left">
                <img src="img/truck.webp" id="truck" class="car5" alt="Orange truck driving left">
            </div>
        </section>
        <div id="tooltip" class="tooltip" aria-live="polite"></div>
    </main>
    
    <script src="js/script.js"></script>
</body>
</html>
